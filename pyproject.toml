[build-system]
requires = ["setuptools>=77"]   # license = "MIT"(SPDX 표현식) 지원 버전
build-backend = "setuptools.build_meta"

[project]
name = "ghrank"
version = "0.1.0"
description = "GitHub 스타 순위 기반 분야별 저장소 추천 · 검색 · 설치/사용/주의점 요약 CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []   # 표준 라이브러리만 사용

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
ghrank = "ghrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghrank = ["categories.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140   # 한글 메시지가 길어 넉넉하게
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
