# ghrank 분야 정의
#
# key      : 명령에서 쓰는 영문 키 (ghrank top video)
# name     : 화면에 보이는 이름
# topics   : GitHub 토픽. 앞 6개만 검색어로 쓴다(GitHub 검색은 AND/OR/NOT 연산자 5개까지 허용).
#            전체 목록은 관련성 판정(저장소 토픽과 얼마나 겹치는지)에 쓴다.
# keywords : 저장소 이름·설명에 이 단어가 있으면 관련 저장소로 본다.
#            영문은 단어 앞부분 일치("upscal" → upscaling), 한·중·일 문자는 부분 일치.
# aliases  : 사용자가 입력할 수 있는 별칭(한글·영문). 띄어쓰기·하이픈은 무시한다.
#
# 자기 분야를 추가하려면 이 파일을 복사해 고친 뒤 --categories-file 로 지정한다.

[[category]]
key = "image"
name = "이미지 생성·편집"
topics = ["text-to-image", "stable-diffusion", "image-generation", "diffusion-models", "image-editing", "super-resolution",
          "image-to-image", "inpainting", "comfyui", "ai-art", "image-processing", "upscaling", "flux", "lora"]
keywords = ["image", "diffusion", "photo", "picture", "upscal", "inpaint", "text-to-image", "img2img", "comfyui",
            "이미지", "图像", "图片", "绘画", "画像"]
aliases = ["이미지", "그림", "사진", "이미지생성", "그림생성", "이미지편집", "image", "images", "img", "photo",
           "picture", "stablediffusion", "text-to-image", "comfyui"]

