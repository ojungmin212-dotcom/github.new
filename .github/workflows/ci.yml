# push·PR 마다 린트·타입 검사·테스트. Windows 는 cp949 출력으로도 검사한다.
name: CI

on:
  push:
    branches: ["**"]   # 모든 브랜치 push 에서 검사(main 합치기 전에 확인)
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 설치
        run: pip install -e ".[dev,mcp]"
      - name: 린트 (ruff)
        run: ruff check src tests
      - name: 타입 검사 (pyright)
        run: pyright
      - name: 테스트
        env:
          PYTHONIOENCODING: ${{ matrix.os == 'windows-latest' && 'cp949' || 'utf-8' }}
        run: python -m pytest -q
      - name: 실행 확인 (네트워크 없음)
        run: |
          ghrank --version
          ghrank categories > categories.txt
          ghrank categories --format md -o categories.md
          ghrank mcp --print-config
      - name: 정확도 측정 (분야 분류, 오프라인)
        run: python evals/run_eval.py --offline
      - name: 바탕화면 아이콘 만들기 확인 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ghrank web --shortcut
          $p = Join-Path ([Environment]::GetFolderPath('Desktop')) 'ghrank.lnk'
          if (-not (Test-Path $p)) { throw "아이콘이 없습니다: $p" }
          $l = (New-Object -ComObject WScript.Shell).CreateShortcut($p)
          "대상: $($l.TargetPath) / 인자: $($l.Arguments)"
          if ($l.TargetPath -notlike '*pythonw.exe') { throw "pythonw.exe 가 아닙니다: $($l.TargetPath)" }
          if ($l.Arguments -ne '-m ghrank web --idle-minutes 30') { throw "인자가 다릅니다: $($l.Arguments)" }
